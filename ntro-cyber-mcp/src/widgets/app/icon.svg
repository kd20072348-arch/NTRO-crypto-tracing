<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <!-- Background -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="8"
    fill="#0d100d"
  />

  <!-- Outer broken intelligence ring -->
  <path
    d="M32 10
       A22 22 0 0 1 51 21"
    fill="none"
    stroke="#85927a"
    stroke-width="3"
    stroke-linecap="square"
  />

  <path
    d="M54 32
       A22 22 0 0 1 43 51"
    fill="none"
    stroke="#85927a"
    stroke-width="3"
    stroke-linecap="square"
  />

  <path
    d="M32 54
       A22 22 0 0 1 13 43"
    fill="none"
    stroke="#85927a"
    stroke-width="3"
    stroke-linecap="square"
  />

  <path
    d="M10 32
       A22 22 0 0 1 21 13"
    fill="none"
    stroke="#85927a"
    stroke-width="3"
    stroke-linecap="square"
  />

  <!-- Crosshair -->
  <path
    d="M32 15 V25
       M32 39 V49
       M15 32 H25
       M39 32 H49"
    stroke="#e7e1d2"
