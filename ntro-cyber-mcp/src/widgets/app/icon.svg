  />

  <!-- Central target -->
  <circle
    cx="32"
    cy="32"
    r="7"
    fill="#0d100d"
    stroke="#c84e39"
    stroke-width="2.5"
  />

  <circle
    cx="32"
    cy="32"
    r="2.5"
